# albion LoRA 重训 v2（2026-10-26 第二轮）：修掉 v1 的两处毛病。
#
# 相对 `albion_lora_rich.yaml`（v1）只改三处：
#   * warmup_steps 1000 → 100（v1 把 warmup 拉满全程，lr 到最后一步才到顶，final 反而最弱）
#   * 显式验证集：data_lora/albion_manifest_rich_v2valid.jsonl（83 条里留出的 5 对/10 行，
#     标了 neutral/bright/sad/strong/whisper 五种标签），这些行**完全不进训练**
#     —— 靠 train.py 新加的 --valid-manifest / valid_manifest_path（见 irodori_tts/config.py）
#   * valid_every 100（每 100 步记一次验证 loss）
# 训练清单：data_lora/albion_manifest_rich_v2train.jsonl（156 行 = 78 条 × 2）
# 其余（batch 1 / lr 1e-4 / text-encoder 1e-5 / max_steps 1000 / save_every 250 /
# max_latent_steps 400 / LoRA r16 alpha32 diffusion_attn / seed 0）与 v1 一致。

model:
  latent_dim: 32
  latent_patch_size: 1
  text_vocab_size: 102400
  text_tokenizer_repo: sbintuitions/modernbert-ja-310m
  text_encoder_revision: 77675fc96a7e445e982e2ba90246b816efc74ec6
  text_encoder_type: pretrained
  text_add_bos: true
  pretrained_projector_type: residual_mlp
  pretrained_projector_hidden_ratio: 2.0
  pretrained_projector_dropout: 0.0
  model_dim: 1280
  num_layers: 12
  num_heads: 20
  mlp_ratio: 2.875
  speaker_mlp_ratio: 2.6
  text_dim: 512
  speaker_dim: 768
  speaker_layers: 8
  speaker_heads: 12
  speaker_patch_size: 4
  timestep_embed_dim: 512
  adaln_rank: 192
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 102400
  caption_tokenizer_repo: sbintuitions/modernbert-ja-310m
  caption_add_bos: true
  caption_dim: 512
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1024
  duration_layers: 3
  duration_dropout: 0.1
  duration_attention_heads: 8
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean

train:
  train_mode: rf
  batch_size: 1
  gradient_accumulation_steps: 1
  num_workers: 2
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: 4
  dataloader_cuda_prefetch: true
  length_bucket_enabled: true
  length_bucket_window_batches: 64
  latent_length_bucket_size: 0
  allow_tf32: true
  compile_model: false
  precision: bf16
  optimizer: adamw
  learning_rate: 0.0001
  pretrained_text_encoder_learning_rate: 0.00001
  weight_decay: 0.01
  lr_scheduler: wsd
  warmup_steps: 100
  stable_steps: 24000
  min_lr_scale: 0.01
  max_steps: 1000
  max_text_len: 256
  max_caption_len: 512
  text_condition_dropout: 0.1
  speaker_condition_dropout: 0.1
  caption_condition_dropout: 0.1
  timestep_stratified: true
  max_latent_steps: 400
  ref_min_seconds: 1.0
  ref_max_seconds: 120.0
  fixed_target_latent_steps:
  fixed_target_full_mask: false
  rf_loss_mode: utterance_mean
  duration_loss_weight: 1.0
  duration_backprop_to_condition: false
  duration_speaker_dropout: 0.1
  duration_caption_dropout: 0.1
  duration_huber_delta: 0.1
  log_every: 100
  save_every: 250
  checkpoint_best_n: 5
  valid_ratio: 0.0
  valid_manifest_path: data_lora/albion_manifest_rich_v2valid.jsonl
  valid_every: 100
  progress: true
  grad_clip_norm: 1.0
  wandb_enabled: false
  wandb_project:
  wandb_entity:
  wandb_run_name:
  wandb_mode: online
  ddp_find_unused_parameters: false
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_bias: none
  lora_target_modules: diffusion_attn
  lora_modules_to_save: auto
  seed: 0
