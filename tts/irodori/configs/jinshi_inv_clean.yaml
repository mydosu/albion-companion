model:
  latent_dim: 32
  latent_patch_size: 1
  model_dim: 1280
  num_layers: 12
  num_heads: 20
  mlp_ratio: 2.875
  text_mlp_ratio: 2.6
  speaker_mlp_ratio: 2.6
  dropout: 0.0
  text_vocab_size: 102400
  text_tokenizer_repo: sbintuitions/modernbert-ja-310m
  text_encoder_revision: 77675fc96a7e445e982e2ba90246b816efc74ec6
  text_add_bos: true
  text_encoder_type: pretrained
  pretrained_projector_type: residual_mlp
  pretrained_projector_hidden_ratio: 2.0
  pretrained_projector_dropout: 0.0
  text_dim: 512
  text_layers: 14
  text_heads: 10
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 102400
  caption_tokenizer_repo: sbintuitions/modernbert-ja-310m
  caption_add_bos: true
  caption_dim: 512
  caption_layers: null
  caption_heads: null
  caption_mlp_ratio: null
  speaker_dim: 768
  speaker_layers: 8
  speaker_heads: 12
  speaker_patch_size: 4
  timestep_embed_dim: 512
  adaln_rank: 192
  norm_eps: 1.0e-05
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1024
  duration_layers: 3
  duration_dropout: 0.1
  duration_attention_heads: 8
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean
train:
  manifest_path: data_lora/jinshi_manifest_clean.jsonl
  output_dir: outputs/jinshi_inv_clean
  batch_size: 4
  num_workers: 4
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  dataloader_cuda_prefetch: false
  length_bucket_enabled: false
  length_bucket_window_batches: 64
  latent_length_bucket_size: 0
  allow_tf32: true
  compile_model: false
  gradient_checkpointing: false
  train_mode: rf
  learning_rate: 0.01
  pretrained_text_encoder_learning_rate: 1.0e-05
  weight_decay: 0.0
  optimizer: adamw
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  muon_momentum: 0.95
  muon_adjust_lr_fn: match_rms_adamw
  lr_scheduler: none
  warmup_steps: 0
  caption_warmup: false
  caption_warmup_steps: 0
  pretrained_projector_warmup_steps: 0
  stable_steps: 0
  min_lr_scale: 0.1
  max_steps: 1000
  log_every: 100
  save_every: 500
  checkpoint_best_n: 0
  valid_ratio: 0.0
  valid_every: 0
  progress: true
  progress_all_ranks: false
  precision: bf16
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 1
  max_text_len: 256
  max_caption_len: 512
  text_condition_dropout: 0.0
  caption_condition_dropout: 0.0
  speaker_condition_dropout: 0.0
  speaker_inversion_enabled: true
  speaker_inversion_tokens: 16
  speaker_inversion_init_std: 0.02
  speaker_inversion_init_embedding: null
  max_latent_steps: 400
  ref_min_seconds: 1.0
  ref_max_seconds: 120.0
  fixed_target_latent_steps: null
  fixed_target_full_mask: false
  rf_loss_mode: utterance_mean
  duration_loss_weight: 0.1
  duration_backprop_to_condition: false
  duration_speaker_dropout: 0.0
  duration_caption_dropout: 0.0
  duration_huber_delta: 0.1
  timestep_logit_mean: 0.0
  timestep_logit_std: 1.0
  timestep_stratified: true
  timestep_min: 0.001
  timestep_max: 0.999
  wandb_enabled: false
  wandb_project: null
  wandb_entity: null
  wandb_run_name: null
  wandb_mode: online
  ddp_find_unused_parameters: false
  lora_enabled: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_bias: none
  lora_target_modules: diffusion_attn
  lora_modules_to_save: auto
  seed: 0
