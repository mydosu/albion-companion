[project]
name = "albion-ear-env"
version = "0.1.0"
description = "Standalone CPU venv for ear/whisper_serve.py (paraformer + faster-whisper)"
requires-python = "==3.10.*"
dependencies = [
    "torch>=2.2",
    "funasr>=1.2",
    "modelscope>=1.20",
    "faster-whisper>=1.1",
    "fastapi>=0.112",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "kaldi-native-fbank>=1.20",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
