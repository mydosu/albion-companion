# 视觉机：llama.cpp server 加载 Qwen3-VL 4B，只开视觉这一路（一个模型、一个容器），
# 对外只提供 /v1/chat/completions（带图）和 /health。
# 用法见 README.md；参数从同目录 .env 读，默认值是一台生产机的实际值（GTX 1660 Ti 6 GB）。
services:
  vision:
    # 生产钉的是通用 tag（本地实例是构建 b9859）；要固定构建就写 server-cuda-b9859。
    image: ${VLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: ${CONTAINER_NAME:-llama-cpp}
    restart: unless-stopped
    ports:
      - "${VLM_LISTEN:-0.0.0.0}:${VLM_PORT:-8080}:8080"
    volumes:
      # 生产挂的是 rw；模型只读就够，这里给 ro。
      - "${MODEL_DIR:-./models}:/models:ro"
    environment:
      - CUDA_VISIBLE_DEVICES=${GPU_DEVICE:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # 生产用的就是这种写法，老版本 compose 也认；gpus: all 要 compose v2.30 以上。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      -m /models/${MODEL_FILE:-Qwen3VL-4B-Instruct-Q4_K_M.gguf}
      --mmproj /models/${MMPROJ_FILE:-mmproj-Qwen3VL-4B-Instruct-F16.gguf}
      --host 0.0.0.0
      --port 8080
      -ngl ${N_GPU_LAYERS:-99}
      --ctx-size ${CTX_SIZE:-5120}
      --threads ${THREADS:-4}
      --parallel ${PARALLEL:-1}
      ${EXTRA_ARGS:-}
